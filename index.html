<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-layout">
    <!-- LEFT UI -->
    <aside id="left-ui">
      <section id="upgrades">
        <h1>Upgrades:</h1>
        <div class="upgrade-item">
          <button id="oma" class="upgrade-btn">Oma</button>
          <span class="tooltip">$50<br>+1$ per second</span>
        </div>
        <div class="upgrade-item">
          <button id="farm" class="upgrade-btn">Farm</button>
          <span class="tooltip">$200<br>+5$ per second</span>
        </div>
      </section>

      <!-- GAMBLE BUTTON at bottom -->
      <section id="gambel">
        <h1>Gambling: 1 in 2 chance</h1>
        <button id="gok">Gamble</button>
      </section>
    </aside>

    <!-- CENTER GAME -->
    <main>
      <h1 id="score">0</h1>
      <p id="perSecond">0 per second</p>
      <img src="cookie.png" alt="cookie" id="cookieImage">
      <button id="reset">Reset</button>
    </main>

    <!-- RIGHT OMA PANEL -->
<section id="image">
  <div id="oma-container"></div>   <!-- top-right -->
  <div id="farm-container"></div>  <!-- middle-right -->
</section>

  </div>
  <script src="javascript.js"></script>
</body>


</html>
