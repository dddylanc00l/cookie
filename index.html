<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="game-layout">
    <!-- LEFT UI -->
    <aside id="left-ui">
      <section id="store">
        <h1>Store</h1>

        <div class="store-item">
          <img src="weedcookie.png" id="weed-cookie" alt="Weed Cookie" class="store-img locked" />
          <span class="tooltip">
            Requires 100 Farms<br>
            Farm production: 5 → 20
          </span>
        </div>
      </section>
      <section id="upgrades">
        <h1>Upgrades:</h1>
        <!-- oma -->
        <div class="upgrade-item">
          <button id="oma" class="upgrade-btn">Oma</button>
          <span class="tooltip"><br></span>
        </div>
        <!--farm-->
        <div class="upgrade-item">
          <button id="farm" class="upgrade-btn">Farm</button>
          <span class="tooltip"><br></span>
        </div>
        <!--mine-->
        <div class="upgrade-item">
          <button id="mine" class="upgrade-btn">Mine</button>
          <span class="tooltip"><br></span>
        </div>
        <!--factory-->
        <div class="upgrade-item">
          <button id="factory" class="upgrade-btn">Factory</button>
          <span class="tooltip"><br></span>
        </div>
        <!--bank-->
        <div class="upgrade-item">
          <button id="bank" class="upgrade-btn">Bank</button>
          <span class="tooltip"><br></span>
        </div>
      </section>

      <!-- GAMBLE BUTTON at bottom -->
      <section id="gambel">
        <h1>Gambling: 1 in 2 chance</h1>
        <button id="gok">Gamble</button>
      </section>
    </aside>

    <!-- CENTER GAME -->
    <main>
      <h1 id="score">0</h1>
      <p id="perSecond">0 per second</p>
      <img src="cookie.png" alt="cookie" id="cookieImage">
      <button id="reset">Reset</button>
    </main>

    <!-- RIGHT OMA PANEL -->
    <section id="image">
      <div id="oma-container"></div>
      <div id="farm-container"></div>
      <div id="mine-container"></div>
      <div id="factory-container"></div>
      <div id="bank-container"></div>
    </section>

  </div>
  <script src="javascript.js"></script>
</body>

</html>
